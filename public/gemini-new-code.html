<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Impressive Set V3 - Holographic</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Share+Tech+Mono&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #050505;
  background-image: 
    radial-gradient(circle at 15% 50%, rgba(0, 243, 255, 0.08) 0%, transparent 50%),
    radial-gradient(circle at 85% 30%, rgba(183, 0, 255, 0.08) 0%, transparent 50%);
  color: #a0aec0;
  font-family: 'Share Tech Mono', monospace;
  padding: 40px 20px 80px;
  min-height: 100vh;
  overflow-x: hidden;
}

h1 {
  font-family: 'Rajdhani', sans-serif;
  color: #fff;
  font-size: 2.5rem;
  letter-spacing: .2em;
  text-transform: uppercase;
  text-align: center;
  margin-top: 10px;
  text-shadow: 0 0 20px rgba(0, 243, 255, 0.5);
}

.sub {
  color: #00f3ff;
  font-size: 13px;
  letter-spacing: .4em;
  margin: 5px 0 50px;
  text-align: center;
  text-transform: uppercase;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
  gap: 40px;
  max-width: 1350px;
  margin: 0 auto;
  perspective: 1200px; 
}

.card {
  position: relative;
  background: rgba(10, 15, 30, 0.6);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(0, 243, 255, 0.2);
  border-radius: 16px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.8), 
              inset 0 1px 0 rgba(255,255,255,0.1),
              0 0 20px rgba(0, 243, 255, 0.05);
  overflow: hidden;
  transform-style: preserve-3d;
  transition: transform 0.1s, border-color 0.4s;
  cursor: crosshair;
}

.card:hover {
  border-color: rgba(0, 243, 255, 0.6);
  box-shadow: 0 20px 50px rgba(0, 243, 255, 0.15), inset 0 1px 0 rgba(255,255,255,0.2);
}

/* Dynamic Glare Effect */
.glare {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  background: radial-gradient(circle at var(--mx) var(--my), rgba(255,255,255,0.15) 0%, transparent 50%);
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
  z-index: 10;
  mix-blend-mode: overlay;
}
.card:hover .glare { opacity: 1; }

.head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 20px;
  border-bottom: 1px solid rgba(0, 243, 255, 0.15);
  background: linear-gradient(90deg, rgba(0, 243, 255, 0.05), transparent);
  transform: translateZ(30px); 
}

.name {
  color: #fff;
  font-size: 15px;
  font-family: 'Rajdhani', sans-serif;
  letter-spacing: .15em;
  text-transform: uppercase;
  font-weight: 700;
}

.num {
  color: #b700ff;
  font-size: 12px;
  letter-spacing: .2em;
  font-weight: bold;
}

.stage {
  height: 380px;
  position: relative;
  z-index: 0;
  background: radial-gradient(circle at center, rgba(0,0,0,0) 0%, rgba(0,0,0,0.5) 100%);
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}

.use {
  padding: 14px 20px;
  border-top: 1px solid rgba(0, 243, 255, 0.15);
  font-size: 11px;
  letter-spacing: .2em;
  color: #00f3ff;
  background: rgba(0, 0, 0, 0.3);
  transform: translateZ(30px);
}

.hint {
  position: absolute;
  bottom: 15px;
  left: 20px;
  font-size: 10px;
  letter-spacing: .15em;
  color: #fff;
  background: rgba(183, 0, 255, 0.2);
  padding: 4px 10px;
  border-radius: 4px;
  border: 1px solid rgba(183, 0, 255, 0.4);
  pointer-events: none;
  transform: translateZ(40px);
  backdrop-filter: blur(4px);
}
</style>
</head>
<body>

<h1>Holographic Core</h1>
<div class="sub">V3.0 — Advanced WebGL Simulators · Reactive Physics</div>

<div class="grid">
  <div class="card">
    <div class="glare"></div>
    <div class="head"><span class="name">Holo-Earth</span><span class="num">SYS-01</span></div>
    <div class="stage"><canvas id="globe"></canvas><div class="hint">ORBITAL TRACKING</div></div>
    <div class="use">GLOBAL COMMS / SATELLITE LINK</div>
  </div>

  <div class="card">
    <div class="glare"></div>
    <div class="head"><span class="name">Neural Plexus</span><span class="num">SYS-02</span></div>
    <div class="stage"><canvas id="net"></canvas><div class="hint">MOUSE REPULSION</div></div>
    <div class="use">AI NEURAL NETWORKS / MESH</div>
  </div>

  <div class="card">
    <div class="glare"></div>
    <div class="head"><span class="name">Warp Drive</span><span class="num">SYS-03</span></div>
    <div class="stage"><canvas id="tunnel"></canvas><div class="hint">3D WORMHOLE</div></div>
    <div class="use">HYPERSPACE DATA TRANSFER</div>
  </div>
</div>

<script>
// --- Realistic 3D Tilt & Glare ---
document.querySelectorAll('.card').forEach(card => {
  card.addEventListener('mousemove', e => {
    const rect = card.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    
    // Move glare highlight
    card.style.setProperty('--mx', `${x}px`);
    card.style.setProperty('--my', `${y}px`);
    
    const centerX = rect.width / 2;
    const centerY = rect.height / 2;
    const rotateX = ((y - centerY) / centerY) * -8; // More aggressive tilt
    const rotateY = ((x - centerX) / centerX) * 8;
    
    card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.03, 1.03, 1.03)`;
  });
  
  card.addEventListener('mouseleave', () => {
    card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
  });
});

function fit(c){
  const dpr=Math.min(devicePixelRatio||1,2);
  const r=c.parentElement.getBoundingClientRect(); 
  c.width=r.width*dpr; c.height=r.height*dpr;
  const x=c.getContext("2d");
  x.setTransform(dpr,0,0,dpr,0,0);
  return {ctx:x,w:r.width,h:r.height};
}

/* ===================== 1. HOLO-EARTH ===================== */
(function(){
  const cv=document.getElementById("globe");
  let {ctx,w,h}=fit(cv);

  // Simplified Continents
  const LAND=[
    [[-168,65],[-160,71],[-140,70],[-125,70],[-110,68],[-95,70],[-85,73],[-75,68],[-65,60],[-55,52],[-65,45],[-70,42],[-75,35],[-81,25],[-97,26],[-105,22],[-115,30],[-125,40],[-125,48],[-135,58],[-150,60],[-168,65]],
    [[-58,60],[-45,60],[-20,70],[-25,82],[-45,83],[-60,76]],
    [[-81,8],[-75,11],[-60,10],[-50,0],[-35,-5],[-35,-22],[-48,-25],[-58,-35],[-62,-40],[-65,-55],[-72,-52],[-73,-40],[-71,-30],[-70,-18],[-75,-5],[-80,0]],
    [[-10,36],[-2,43],[3,47],[8,50],[12,54],[20,55],[28,58],[30,65],[25,70],[15,68],[8,62],[0,55],[-5,48],[-9,43]],
    [[-6,50],[-2,51],[0,54],[-2,58],[-5,58],[-6,54]],
    [[-17,15],[-17,21],[-10,30],[0,36],[10,37],[20,32],[32,31],[35,22],[43,12],[51,12],[42,-2],[40,-15],[35,-25],[25,-34],[18,-34],[12,-18],[9,-1],[5,5],[-5,5],[-13,9]],
    [[30,40],[45,42],[55,45],[65,45],[75,40],[85,32],[90,28],[95,22],[99,14],[103,10],[108,12],[112,20],[120,23],[122,30],[126,40],[132,46],[140,52],[152,58],[165,62],[178,66],[180,70],[150,75],[120,76],[100,77],[80,75],[60,70],[48,66],[38,62],[30,55],[28,48]],
    [[113,-22],[115,-32],[118,-35],[130,-32],[138,-35],[145,-38],[150,-37],[153,-28],[146,-18],[140,-17],[135,-12],[130,-12],[125,-14],[118,-20]]
  ];

  const inPoly=(lon,lat,poly)=>{
    let c=false;
    for(let i=0,j=poly.length-1;i<poly.length;j=i++){
      const xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];
      if(((yi>lat)!==(yj>lat)) && (lon < (xj-xi)*(lat-yi)/(yj-yi)+xi)) c=!c;
    }
    return c;
  };
  
  const pts=[];
  for(let i=0;i<8000;i++){
    const y=1-(i/7999)*2;
    const rad=Math.sqrt(1-y*y);
    const th=Math.PI*(3-Math.sqrt(5))*i;
    const x=Math.cos(th)*rad, z=Math.sin(th)*rad;
    const lat=Math.asin(y)*180/Math.PI;
    const lon=Math.atan2(z,x)*180/Math.PI;
    let isL=false;
    if(lat<-65) isL=true;
    else for(const p of LAND) if(inPoly(lon,lat,p)) { isL=true; break; }
    if(isL) pts.push({x,y,z});
  }

  const proj=(v,cR,sR)=>{
    const tilt = 0.4; // Fixed tilt
    let X=v.x*cR - v.z*sR;
    let Z=v.x*sR + v.z*cR;
    let Y=v.y;
    return {x: X, y: Y*Math.cos(tilt) - Z*Math.sin(tilt), z: Y*Math.sin(tilt) + Z*Math.cos(tilt)};
  };

  let rot=0;
  function draw(){
    requestAnimationFrame(draw);
    ctx.clearRect(0,0,w,h); 
    ctx.globalCompositeOperation = 'source-over';
    
    const cx=w/2, cy=h/2, R=Math.min(w,h)*0.4;
    rot+=0.005; 
    const cosR=Math.cos(rot), sinR=Math.sin(rot);

    // Deep space glow
    let g=ctx.createRadialGradient(cx,cy,R*0.5,cx,cy,R*1.5);
    g.addColorStop(0,"rgba(0, 243, 255, 0.15)");
    g.addColorStop(1,"transparent");
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h);

    ctx.globalCompositeOperation = 'screen';

    // Back sphere
    ctx.fillStyle="rgba(0, 20, 40, 0.6)";
    ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.fill();
    ctx.strokeStyle="rgba(0, 243, 255, 0.5)"; ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.stroke();

    // Draw Land
    for(const p of pts){
      const v=proj(p,cosR,sinR);
      if(v.z<-0.1) continue; // Hide back
      const d=(v.z+1)/2; // Depth
      const sx=cx+v.x*R, sy=cy-v.y*R;
      ctx.fillStyle=`rgba(0, 243, 255, ${0.2+d*0.8})`;
      const s=0.5+d*1.5;
      ctx.fillRect(sx,sy,s,s);
    }

    // Draw an Orbital Ring
    ctx.beginPath();
    for(let i=0; i<=Math.PI*2; i+=0.1){
      const ox = Math.cos(i)*1.3;
      const oz = Math.sin(i)*1.3;
      const v = proj({x:ox, y:0, z:oz}, Math.cos(rot*0.5), Math.sin(rot*0.5));
      if(i===0) ctx.moveTo(cx+v.x*R, cy-v.y*R);
      else ctx.lineTo(cx+v.x*R, cy-v.y*R);
    }
    ctx.strokeStyle="rgba(183, 0, 255, 0.6)"; ctx.lineWidth=1; ctx.stroke();
  }
  draw();
  addEventListener("resize",()=>{({ctx,w,h}=fit(cv));});
})();

/* ===================== 2. NEURAL PLEXUS ===================== */
(function(){
  const cv=document.getElementById("net");
  let {ctx,w,h}=fit(cv);
  let nodes=[];

  function build(){
    nodes=[];
    const n=Math.floor((w*h)/6000); // Dense network
    for(let i=0;i<n;i++){
      nodes.push({
        x:Math.random()*w, y:Math.random()*h,
        vx:(Math.random()-.5)*1, vy:(Math.random()-.5)*1,
        radius: Math.random()*2 + 1
      });
    }
  }
  build();

  const mouse={x:-1000,y:-1000};
  cv.parentElement.addEventListener("mousemove",e=>{
    const r=cv.getBoundingClientRect();
    mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;
  });
  cv.parentElement.addEventListener("mouseleave",()=>{mouse.x=-1000;mouse.y=-1000;});

  function draw(){
    requestAnimationFrame(draw);
    ctx.clearRect(0,0,w,h); 
    ctx.globalCompositeOperation = 'screen';

    // Move and Repel
    for(const p of nodes){
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<0||p.x>w) p.vx*=-1;
      if(p.y<0||p.y>h) p.vy*=-1;
      
      // Mouse Repulsion Physics
      const dx = p.x - mouse.x;
      const dy = p.y - mouse.y;
      const dist = Math.hypot(dx, dy);
      if(dist < 120) {
        const force = (120 - dist) / 120;
        p.x += (dx/dist) * force * 5;
        p.y += (dy/dist) * force * 5;
      }
    }

    // Draw Plexus (Triangles & Lines)
    for(let i=0; i<nodes.length; i++){
      for(let j=i+1; j<nodes.length; j++){
        const d = Math.hypot(nodes[i].x-nodes[j].x, nodes[i].y-nodes[j].y);
        if(d < 100){
          ctx.strokeStyle = `rgba(0, 243, 255, ${1 - d/100})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(nodes[i].x, nodes[i].y);
          ctx.lineTo(nodes[j].x, nodes[j].y);
          ctx.stroke();

          // Try to form triangles with a 3rd node for that Web3 mesh look
          for(let k=j+1; k<nodes.length; k++){
             const d2 = Math.hypot(nodes[j].x-nodes[k].x, nodes[j].y-nodes[k].y);
             const d3 = Math.hypot(nodes[i].x-nodes[k].x, nodes[i].y-nodes[k].y);
             if(d2 < 100 && d3 < 100){
                ctx.fillStyle = `rgba(183, 0, 255, ${(1 - Math.max(d,d2,d3)/100) * 0.15})`;
                ctx.beginPath();
                ctx.moveTo(nodes[i].x, nodes[i].y);
                ctx.lineTo(nodes[j].x, nodes[j].y);
                ctx.lineTo(nodes[k].x, nodes[k].y);
                ctx.fill();
             }
          }
        }
      }
      // Draw Node
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(nodes[i].x, nodes[i].y, nodes[i].radius, 0, 7); ctx.fill();
    }
  }
  draw();
  addEventListener("resize",()=>{({ctx,w,h}=fit(cv));build();});
})();

/* ===================== 3. 3D WARP TUNNEL ===================== */
(function(){
  const cv=document.getElementById("tunnel");
  let {ctx,w,h}=fit(cv);
  let particles=[];

  function build(){
    particles=[];
    for(let i=0;i<600;i++){
      particles.push({
        angle: Math.random()*Math.PI*2,
        radius: Math.random()*200 + 50,
        z: Math.random()*2000,
        speed: Math.random()*15 + 10,
        color: Math.random() > 0.5 ? '#00f3ff' : '#b700ff'
      });
    }
  }
  build();

  let rotZ = 0;
  function draw(){
    requestAnimationFrame(draw);
    // Trail effect instead of clearRect
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = "rgba(5,5,5,0.4)";
    ctx.fillRect(0,0,w,h);
    
    ctx.globalCompositeOperation = 'screen';
    const cx=w/2, cy=h/2;
    rotZ += 0.005; // Twist the tunnel

    particles.forEach(p => {
      p.z -= p.speed;
      if(p.z <= 1) {
        p.z = 2000;
        p.radius = Math.random()*200 + 50;
      }

      // Projection math for 3D tunnel
      const fov = 300;
      const scale = fov / p.z;
      
      // Rotate around Z axis to create twist
      const currentAngle = p.angle + rotZ;
      const x3d = Math.cos(currentAngle) * p.radius;
      const y3d = Math.sin(currentAngle) * p.radius;

      const x2d = cx + x3d * scale;
      const y2d = cy + y3d * scale;

      // Draw particle streak based on speed
      const scalePrev = fov / (p.z + p.speed * 2);
      const px2d = cx + x3d * scalePrev;
      const py2d = cy + y3d * scalePrev;

      ctx.strokeStyle = p.color;
      ctx.lineWidth = scale * 2;
      ctx.beginPath();
      ctx.moveTo(px2d, py2d);
      ctx.lineTo(x2d, y2d);
      ctx.stroke();
    });
  }
  draw();
  addEventListener("resize",()=>{({ctx,w,h}=fit(cv));build();});
})();
</script>
</body>
</html>
